name: Generate TipToi catalog

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  generate-catalog:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Scrape products
        run: uv run python .github/scripts/generate.py
